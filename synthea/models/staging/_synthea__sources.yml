version: 2

sources:
  - name: synthea
    description: >
      Raw data direct from the DuckDB files. No transformations applied.
    schema: raw
    tables:
      - name: patients
        description: one row per patient
        columns:
          - name: Id
            description: unique identifier
            tests:
              - unique
              - not_null
      - name: allergies
      - name: careplans
      - name: claims_transactions
      - name: claims
      - name: conditions
      - name: devices
      - name: encounters
      - name: imaging_studies
      - name: immunizations
      - name: medications
      - name: observations
      - name: organizations
      - name: payer_transitions
      - name: payers
      - name: procedures
      - name: providers
      - name: supplies

